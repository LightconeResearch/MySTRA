[project]

site_name = "MySTRA"
site_description = "MySTRA — write publications on top of ASTRA analyses, in plain MyST Markdown."
site_author = "Lightcone Research"
site_url = "https://lightconeresearch.github.io/MySTRA/"
copyright = "&copy; 2026 Centre National de la Recherche Scientifique (CNRS) and The Regents of the University of California"

repo_url = "https://github.com/LightconeResearch/MySTRA"
repo_name = "LightconeResearch/MySTRA"

nav = [
  { "Documentation" = [
      { "Home" = "index.md" },
      { "Getting started" = "getting-started.md" },
  ] },
  { "Authoring" = [
      { "Overview" = "authoring/index.md" },
      { "Paths" = "authoring/paths.md" },
      { "Inline references" = "authoring/inline-references.md" },
      { "Block embeds" = "authoring/block-embeds.md" },
      { "Live values" = "authoring/live-values.md" },
      { "Multi-page reports" = "authoring/multi-page.md" },
  ] },
  { "Reference" = [
      { "Configuration" = "reference/configuration.md" },
      { "Theming" = "reference/theming.md" },
  ] },
]

[project.theme]

variant = "modern"
favicon = "assets/favicon.svg"

features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
]

[project.theme.icon]
logo = "lucide/feather"

# Light/dark palettes with a manual toggle.
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
